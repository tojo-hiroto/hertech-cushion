<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF7F2">
<title>無料イベントのご案内｜HerTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<style>
  /* HerTechブランドカラー：プライマリー #DFA882 / #FFFFFF、セカンダリー #385F7F */
  :root {
    --peach: #DFA882;
    --peach-dark: #B97F57;   /* 文字で使う時の濃いめ */
    --peach-tint: #FBEFE5;
    --navy: #385F7F;
    --ink: #24394C;          /* 本文 */
    --sub: #6E7F8E;
    --paper: #FBF7F2;        /* 生成り */
    --line: #E7DDD2;
    --sky: #6AAAD9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
  .hand { font-family: "Yomogi", "Zen Kaku Gothic New", sans-serif; font-weight: 400; }

  /* 背景：右上にだけ、ブランドのピーチの面を静かに置く */
  .deco { position: fixed; z-index: -1; pointer-events: none; }
  .deco.d1 { top: -120px; right: -140px; width: 300px; height: 300px; border-radius: 50%; background: var(--peach-tint); }
  .deco.d2 { bottom: -60px; left: -50px; width: 140px; height: 140px; border-radius: 50%; border: 1.5px dashed #E9D6C5; }

  .wrap {
    max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
    padding: 26px 22px calc(32px + env(safe-area-inset-bottom));
  }

  /* 上部：質問番号 */
  .q { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .q .num { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--navy); }
  .q .bars { display: flex; gap: 4px; }
  .q .bars i { display: block; width: 22px; height: 3px; border-radius: 2px; background: var(--line); transition: background .3s ease; }
  .q .bars i.on { background: var(--peach); }

  /* パネル切替（動き①：横スライド） */
  .panel { display: none; }
  .panel.show { display: block; }
  .panel.in-right { animation: inRight .38s cubic-bezier(.2,.8,.2,1) both; }
  .panel.in-left { animation: inLeft .38s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes inRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes inLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

  /* 見出し：左揃え・大小差 */
  .head { position: relative; margin-bottom: 26px; }
  .head h1 { font-size: 32px; font-weight: 900; line-height: 1.35; letter-spacing: .01em; color: var(--ink); }
  .head h1 .u { position: relative; display: inline-block; }
  .head h1 .u svg { position: absolute; left: -2px; bottom: -6px; width: calc(100% + 4px); height: 12px; }
  .head p { margin-top: 12px; font-size: 14px; line-height: 1.8; color: var(--sub); font-weight: 500; }
  .memo {
    position: absolute; right: 4px; top: -4px;
    font-size: 15px; color: var(--peach-dark); transform: rotate(6deg); line-height: 1.3; text-align: center;
  }
  .memo svg { display: block; width: 34px; height: 26px; margin: 2px 0 0 4px; }

  /* ===== 選択肢カード ===== */
  .fields, .ages { display: grid; gap: 14px; }
  .ages { gap: 12px; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 14px 16px 14px 14px; border-radius: 14px;
    background: #fff; border: 1.5px solid var(--line);
    box-shadow: 3px 3px 0 #EFE4D8;
    transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #EFE4D8; }
  .opt:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
  /* 動き②：選んだときの反応 */
  .opt.selected { border-color: var(--peach); background: #FFF9F4; box-shadow: 3px 3px 0 var(--peach); }
  .opt .arrow { flex: none; margin-left: auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--navy); transition: all .15s ease; }
  .opt .arrow svg { width: 15px; height: 15px; }
  .opt .arrow .ck { display: none; }
  .opt.selected .arrow { background: var(--peach); border-color: var(--peach); color: #fff; }
  .opt.selected .arrow .ar { display: none; }
  .opt.selected .arrow .ck { display: block; }

  .opt .t { min-width: 0; }
  .opt .t b { display: block; font-size: 21px; font-weight: 900; letter-spacing: .01em; white-space: nowrap; }
  .opt .t span { display: block; margin-top: 3px; font-size: 12px; color: var(--sub); font-weight: 500; }

  /* ===== STEP1：制作物のミニ見本 ===== */
  .thumb { position: relative; flex: none; width: 96px; height: 74px; border-radius: 8px; background: #F4EEE7; }
  .thumb .clip { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; }
  .tape { position: absolute; z-index: 2; width: 44px; height: 14px; background: rgba(223,168,130,.5); top: -6px; left: 30px; transform: rotate(-7deg); }

  /* Webデザイン：ブラウザ枠＋サイト */
  .site { position: absolute; inset: 9px 8px 8px; border-radius: 4px; background: #fff; box-shadow: 0 1px 2px rgba(36,57,76,.12); overflow: hidden; }
  .site .bar { display: flex; height: 7px; background: #EEE6DD; gap: 2px; align-items: center; padding-left: 3px; }
  .site .bar i { display: block; width: 3px; height: 3px; border-radius: 50%; background: #D3C4B5; }
  .site .hero { display: block; height: 27px; margin: 4px; border-radius: 2px; background: linear-gradient(135deg, var(--peach), #EBC4A6); position: relative; }
  .site .hero::after { content: ""; position: absolute; left: 5px; top: 7px; width: 34px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.9); box-shadow: 0 7px 0 -1px rgba(255,255,255,.7); }
  .site .cols { display: flex; gap: 3px; margin: 0 4px; }
  .site .cols i { display: block; flex: 1; height: 13px; border-radius: 2px; background: #EAF2F8; }
  .site .cols i:nth-child(2) { background: #F6EBE2; }

  /* 動画編集：プレビュー＋タイムライン */
  .edit { position: absolute; inset: 0; background: #2B3A48; padding: 6px; }
  .edit .pv { display: block; height: 38px; border-radius: 3px; background: linear-gradient(160deg, #6A8BA6, #385F7F); position: relative; }
  .edit .pv::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-40%, -50%); border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .edit .tl { display: grid; margin-top: 5px; gap: 3px; }
  .edit .tl i { display: block; height: 6px; border-radius: 2px; }
  .edit .tl i:nth-child(1) { width: 78%; background: var(--peach); }
  .edit .tl i:nth-child(2) { width: 56%; margin-left: 14%; background: var(--sky); }
  .edit .tl i:nth-child(3) { width: 88%; background: #8FA3B4; }
  .edit .ph { position: absolute; top: 46px; bottom: 4px; left: 52%; width: 1.5px; background: #fff; }

  .foot { margin-top: 22px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--sub); font-weight: 500; }
  .foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--peach); }

  /* ===== STEP2：年代 ===== */
  .picked { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; font-size: 13px; color: var(--sub); font-weight: 500; }
  .picked b { color: var(--navy); font-weight: 700; }
  .picked button { color: var(--peach-dark); font-size: 12.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 4px 2px; margin-left: 4px; }
  .age { padding: 12px 16px 12px 12px; gap: 14px; }
  .age img { flex: none; width: 60px; height: 60px; border-radius: 50%; background: #F4EEE7; }
  .age .t b { font-size: 22px; }
  .age .t b small { font-size: 15px; font-weight: 700; margin-left: 1px; }
  .age.selected .t span { color: var(--peach-dark); }

  @media (hover: hover) { .opt:hover { border-color: #D9C6B4; } }
  @media (max-width: 360px) {
    .head h1 { font-size: 27px; }
    .thumb { width: 88px; height: 68px; }
    .opt .t b { font-size: 19px; }
    .memo { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .panel.in-right, .panel.in-left { animation: none; } }
</style>
</head>
<body>
<div class="deco d1" aria-hidden="true"></div>
<div class="deco d2" aria-hidden="true"></div>

<main class="wrap">

  <div class="q" aria-hidden="true">
    <span class="num" id="qnum">Q1 / 2</span>
    <span class="bars"><i id="bar1" class="on"></i><i id="bar2"></i></span>
  </div>

  <!-- ========== STEP1：分野 ========== -->
  <section class="panel" id="step-field" aria-labelledby="t1">
    <div class="head">
      <div class="memo hand" aria-hidden="true">どっちも<br>無料だよ
        <svg viewBox="0 0 34 26" fill="none" stroke="#DFA882" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M28 2c-2 10-9 17-21 19"/><path d="M12 15l-5 6 7 2"/></svg>
      </div>
      <h1 id="t1">どっちが<br><span class="u">気になる？<svg viewBox="0 0 100 12" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M2 8c14-4 30-5 48-3s34 2 48-2" stroke="#DFA882" stroke-width="4" stroke-linecap="round"/></svg></span></h1>
      <p>あなたに合う無料イベントをご案内します。</p>
    </div>

    <div class="fields">
      <button class="opt" type="button" data-field="wd">
        <span class="thumb" aria-hidden="true">
          <span class="tape"></span>
          <span class="clip"><span class="site"><span class="bar"><i></i><i></i><i></i></span><span class="hero"></span><span class="cols"><i></i><i></i><i></i></span></span></span>
        </span>
        <span class="t"><b>Webデザイン</b><span>バナーやサイトをつくる</span></span>
        <span class="arrow" aria-hidden="true">
          <svg class="ar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          <svg class="ck" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
        </span>
      </button>

      <button class="opt" type="button" data-field="ve">
        <span class="thumb" aria-hidden="true">
          <span class="clip"><span class="edit"><span class="pv"></span><span class="tl"><i></i><i></i><i></i></span><span class="ph"></span></span></span>
        </span>
        <span class="t"><b>動画編集</b><span>YouTube・SNS動画を編集</span></span>
        <span class="arrow" aria-hidden="true">
          <svg class="ar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          <svg class="ck" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
        </span>
      </button>
    </div>

    <p class="foot"><span class="dot"></span>オンライン参加・スマホからでもOK</p>
  </section>

  <!-- ========== STEP2：年代 ========== -->
  <section class="panel" id="step-age" aria-labelledby="t2">
    <div class="picked">選んだ分野：<b id="chosenName"></b><button type="button" id="change">変更する</button></div>
    <div class="head">
      <h1 id="t2">年代を<br><span class="u">教えてね<svg viewBox="0 0 100 12" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M2 7c16-3 32-4 50-2s32 3 46-1" stroke="#DFA882" stroke-width="4" stroke-linecap="round"/></svg></span></h1>
      <p>年代ごとに、内容を合わせた回を用意しています。</p>
    </div>

    <div class="ages">
      <button class="opt age" type="button" data-age="20">
        <img src="../assets/age-20.png" alt="">
        <span class="t"><b>20代</b><span>はじめての副業・転職に</span></span>
        <span class="arrow" aria-hidden="true">
          <svg class="ar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          <svg class="ck" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
        </span>
      </button>
      <button class="opt age" type="button" data-age="30">
        <img src="../assets/age-30.png" alt="">
        <span class="t"><b>30代</b><span>家事・育児と両立したい</span></span>
        <span class="arrow" aria-hidden="true">
          <svg class="ar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          <svg class="ck" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
        </span>
      </button>
      <button class="opt age" type="button" data-age="40">
        <img src="../assets/age-40.png" alt="">
        <span class="t"><b>40代<small>以上</small></b><span>これからの働き方を考えたい</span></span>
        <span class="arrow" aria-hidden="true">
          <svg class="ar" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          <svg class="ck" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
        </span>
      </button>
    </div>
  </section>
</main>

<script>
(function () {
  // 遷移先LP（分野 × 年代）
  var LP = {
    wd: {
      20: "https://lp.her-tech.jp/20wdig-pm",
      30: "https://lp.her-tech.jp/30wdig-pm",
      40: "https://lp.her-tech.jp/40wdig-pm"
    },
    ve: {
      20: "https://lp.her-tech.jp/20veig-pm",
      30: "https://lp.her-tech.jp/30veig-pm",
      40: "https://lp.her-tech.jp/40veyt-pm"
    }
  };
  var FIELD = { wd: "Webデザイン", ve: "動画編集" };
  var SELECT_DELAY = 220;  // 選択の反応を見せてから次へ進むまで（ms）

  var field = null, current = null, busy = false;

  // このページの ?以降 をLPへ引き継ぐ（同名キーはこのページの値を優先）
  function buildUrl(base) {
    var incoming = new URLSearchParams(window.location.search);
    var url = new URL(base);
    incoming.forEach(function (v, k) { url.searchParams.delete(k); });
    incoming.forEach(function (v, k) { url.searchParams.append(k, v); });
    return url.toString();
  }

  function show(id, dir) {
    document.querySelectorAll(".panel").forEach(function (p) {
      p.classList.remove("show", "in-right", "in-left");
      if (p.id === id) { void p.offsetWidth; p.classList.add("show", dir === "back" ? "in-left" : "in-right"); }
    });
    document.querySelectorAll(".opt").forEach(function (o) { o.classList.remove("selected"); });
    window.scrollTo(0, 0);
  }

  function setQ(n) {
    document.getElementById("qnum").textContent = "Q" + n + " / 2";
    document.getElementById("bar2").classList.toggle("on", n === 2);
  }

  // 分野はハッシュ（#wd / #ve）で保持：?以降を保ったまま、ブラウザの「戻る」でQ1へ戻れる
  function render() {
    busy = false;
    var h = window.location.hash.replace("#", "");
    if (h === "wd" || h === "ve") {
      field = h;
      document.getElementById("chosenName").textContent = FIELD[h];
      show("step-age", current === "step-field" ? "fwd" : "back");
      current = "step-age"; setQ(2);
    } else {
      field = null;
      show("step-field", current === "step-age" ? "back" : "fwd");
      current = "step-field"; setQ(1);
    }
  }

  document.querySelectorAll("[data-field]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (busy) return; busy = true;
      btn.classList.add("selected");
      setTimeout(function () { window.location.hash = btn.dataset.field; }, SELECT_DELAY);
    });
  });

  document.querySelectorAll("[data-age]").forEach(function (btn) {
    var sub = btn.querySelector(".t span"), original = sub.textContent;
    btn.addEventListener("click", function () {
      if (busy || !field) return; busy = true;
      var age = btn.dataset.age, dest = buildUrl(LP[field][age]);
      btn.classList.add("selected");
      sub.textContent = "ご案内ページへ移動しています…";
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "cushion_select", cushion_field: field, cushion_age: age, cushion_dest: dest, cushion_ver: "v2" });
      setTimeout(function () { window.location.href = dest; }, SELECT_DELAY);
    });
    btn.dataset.sub = original;
  });

  document.getElementById("change").addEventListener("click", function () { window.location.hash = ""; });
  window.addEventListener("hashchange", render);
  // LPから「戻る」で帰ってきたとき（bfcache）に、選択中の表示を元に戻す
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    document.querySelectorAll("[data-age]").forEach(function (b) { b.querySelector(".t span").textContent = b.dataset.sub; });
    current = null; render();
  });
  render();
})();
</script>
</body>
</html>
