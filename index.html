<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>無料イベントのご案内｜HerTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff7f2a;
    --blue: #2d7ff9;
    --navy: #142640;
    --gray: #8792a6;
    --line: #d5dbe6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    color: var(--navy);
    background: #fff;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 背景（四隅の青・オレンジの波） ===== */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #fff; }
  .bg svg { width: 100%; height: 100%; display: block; }

  .wrap {
    max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
    padding: 0 18px calc(32px + env(safe-area-inset-bottom));
  }

  /* ===== ステップ表示 ===== */
  .steps { display: flex; justify-content: center; position: relative; }
  .step { position: relative; z-index: 1; text-align: center; }
  .step .dot {
    margin: 0 auto 10px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; background: #c3cad6;
  }
  .step .dot svg { width: 46%; height: 46%; }
  .step .label { font-weight: 700; color: var(--gray); white-space: nowrap; }
  .step.on .dot { background: var(--orange); }
  .step.on .label { color: var(--orange); }
  .steps .bar { position: absolute; height: 4px; border-radius: 2px; background: #d7dde7; }
  .steps .bar.on { background: var(--orange); }

  /* STEP1のステップ表示（2段） */
  .steps-1 { padding-top: 108px; margin-bottom: 44px; gap: 0; }
  .steps-1 .step { width: 140px; }
  .steps-1 .dot { width: 34px; height: 34px; font-size: 17px; }
  .steps-1 .label { font-size: 13.5px; }
  .steps-1 .step:first-of-type .label { color: var(--orange); }
  .steps-1 .bar { top: 125px; left: calc(50% - 53px); width: 106px; background: #d7dde7; }

  /* STEP2のステップ表示（3段） */
  .steps-2 { padding-top: 74px; margin-bottom: 28px; justify-content: space-between; }
  .steps-2 .step { width: 33.3%; }
  .steps-2 .dot { width: 32px; height: 32px; font-size: 16px; }
  .steps-2 .label { font-size: 12px; }
  .steps-2 .step.todo .dot { background: #fff; color: #a8b1c0; border: 2px solid #d7dde7; }
  .steps-2 .bar { top: 89px; }
  .steps-2 .bar.b1 { left: 16.6%; width: 33.4%; }
  .steps-2 .bar.b2 { left: 50%; width: 33.4%; }

  /* ===== 見出し（両脇の放射線つき） ===== */
  .title {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-weight: 900; line-height: 1.5; letter-spacing: .03em; text-align: center;
  }
  .title .spark { flex: none; width: 24px; height: 30px; }
  .title .spark.r { transform: scaleX(-1); }

  /* ===== パネル切替 ===== */
  .panel { display: none; }
  .panel.show { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== STEP1：興味分野 ===== */
  #step-field .title { font-size: 30px; margin-bottom: 36px; }
  .field-list { display: flex; flex-direction: column; gap: 18px; }
  .field {
    display: flex; align-items: center; width: 100%; height: 124px;
    padding: 0 14px 0 10px; border-radius: 28px;
    background: rgba(255,255,255,.96);
    border: 1px solid #fbe2d3;
    box-shadow: 0 6px 18px rgba(255, 140, 80, .16), 0 1px 3px rgba(20,38,64,.05);
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .field + .field { border-color: #dfe7f5; box-shadow: 0 6px 18px rgba(80, 140, 255, .14), 0 1px 3px rgba(20,38,64,.05); }
  .field:active { transform: scale(.98); }
  .field img { flex: none; width: 86px; height: 86px; }
  .field .sep { flex: none; width: 1.5px; height: 62px; background: #d9dee8; margin: 0 16px 0 10px; }
  .field .name { flex: 1; white-space: nowrap; font-size: 27px; font-weight: 900; letter-spacing: .02em; }
  .chev { flex: none; width: 22px; height: 22px; color: var(--blue); }

  /* ===== STEP2：年代（白いカードの中に選択肢） ===== */
  .sheet {
    background: rgba(255,255,255,.97);
    border-radius: 22px;
    padding: 34px 18px 92px;
    box-shadow: 0 8px 30px rgba(20, 38, 64, .06);
  }
  #step-age .title { font-size: 24px; margin-bottom: 26px; gap: 6px; white-space: nowrap; }
  #step-age .title .spark { width: 20px; height: 26px; }
  .age-list { display: flex; flex-direction: column; gap: 14px; }
  .age {
    display: flex; align-items: center; width: 100%; height: 90px;
    padding: 0 20px 0 16px; border-radius: 18px;
    background: #fff; border: 1.5px solid var(--line);
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    transition: transform .12s ease, border-color .2s ease;
  }
  .age:active { transform: scale(.98); }
  .age img { flex: none; width: 74px; height: 74px; border-radius: 50%; }
  .age .name { flex: 1; margin-left: 20px; font-size: 26px; font-weight: 900; letter-spacing: .02em; }

  .field:focus-visible, .age:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  @media (hover: hover) {
    .field:hover { box-shadow: 0 10px 26px rgba(255, 127, 42, .25); }
    .age:hover { border-color: var(--orange); }
  }
  @media (max-width: 360px) {
    #step-field .title { font-size: 26px; }
    .field .name { font-size: 24px; }
    .field img { width: 80px; height: 80px; }
    .steps-1 .step { width: 120px; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 941 1672" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="gTL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb1ff"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/></linearGradient>
      <linearGradient id="gTR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7d33"/><stop offset="1" stop-color="#ffd7bd" stop-opacity="0"/></linearGradient>
      <linearGradient id="gBL" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#56acff"/><stop offset="1" stop-color="#d6eaff" stop-opacity="0"/></linearGradient>
      <linearGradient id="gBR" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8a45"/><stop offset="1" stop-color="#ffe0cc" stop-opacity="0"/></linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <g filter="url(#soft)">
      <!-- 左上：青 -->
      <path d="M0 0 H420 C330 40 250 90 180 170 C110 250 60 290 0 310 Z" fill="url(#gTL)"/>
      <!-- 右上：オレンジ -->
      <path d="M380 0 H941 V300 C860 300 790 270 720 210 C640 140 560 60 380 0 Z" fill="url(#gTR)"/>
      <!-- 左下：青 -->
      <path d="M0 1350 C120 1380 230 1440 330 1530 C390 1585 430 1630 470 1672 H0 Z" fill="url(#gBL)"/>
      <!-- 右下：オレンジ -->
      <path d="M941 1380 C850 1430 760 1500 660 1560 C590 1600 500 1640 380 1672 H941 Z" fill="url(#gBR)"/>
    </g>
    <!-- 白い波のハイライト -->
    <path d="M0 330 C140 250 240 140 420 70 C560 20 700 30 941 0" stroke="#fff" stroke-opacity=".7" stroke-width="22" fill="none" filter="url(#soft)"/>
    <path d="M0 1440 C200 1400 380 1500 560 1560 C700 1610 820 1580 941 1500" stroke="#fff" stroke-opacity=".6" stroke-width="22" fill="none" filter="url(#soft)"/>
  </svg>
</div>

<!-- 見出し両脇の放射線 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="spark" viewBox="0 0 24 30">
    <g fill="none" stroke="#ff8a3d" stroke-width="2.6" stroke-linecap="round">
      <path d="M12 2l5 10"/><path d="M3 13l12 6"/><path d="M5 27l12-4"/>
    </g>
  </symbol>
</svg>

<main class="wrap">

  <!-- ========== STEP1：興味分野 ========== -->
  <section class="panel" id="step-field" aria-labelledby="t1">
    <div class="steps steps-1" aria-hidden="true">
      <div class="bar"></div>
      <div class="step on"><div class="dot">1</div><div class="label">興味の選択</div></div>
      <div class="step"><div class="dot">2</div><div class="label">年代の選択</div></div>
    </div>

    <h1 class="title" id="t1">
      <svg class="spark"><use href="#spark"/></svg>
      <span>興味のある分野を<br>教えてください</span>
      <svg class="spark r"><use href="#spark"/></svg>
    </h1>

    <div class="field-list">
      <button class="field" type="button" data-field="wd">
        <img src="assets/field-wd.png" alt="">
        <span class="sep"></span>
        <span class="name">Webデザイン</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="field" type="button" data-field="ve">
        <img src="assets/field-ve.png" alt="">
        <span class="sep"></span>
        <span class="name">動画編集</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- ========== STEP2：年代 ========== -->
  <section class="panel" id="step-age" aria-labelledby="t2">
    <div class="steps steps-2" aria-hidden="true">
      <div class="bar b1 on"></div>
      <div class="bar b2"></div>
      <div class="step on done">
        <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <div class="label" style="color:var(--gray)">興味分野の選択</div>
      </div>
      <div class="step on"><div class="dot">2</div><div class="label">年代の選択</div></div>
      <div class="step todo"><div class="dot">3</div><div class="label">おすすめのご案内</div></div>
    </div>

    <div class="sheet">
      <h1 class="title" id="t2">
        <svg class="spark"><use href="#spark"/></svg>
        <span>年代を教えてください</span>
        <svg class="spark r"><use href="#spark"/></svg>
      </h1>
      <div class="age-list">
        <button class="age" type="button" data-age="20">
          <img src="assets/age-20.png" alt="">
          <span class="name">20代</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="age" type="button" data-age="30">
          <img src="assets/age-30.png" alt="">
          <span class="name">30代</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="age" type="button" data-age="40">
          <img src="assets/age-40.png" alt="">
          <span class="name">40代以上</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

</main>

<script>
(function () {
  // 遷移先LP（分野 × 年代）
  var LP = {
    wd: {
      20: "https://lp.her-tech.jp/20wdig-pm",
      30: "https://lp.her-tech.jp/30wdig-pm",
      40: "https://lp.her-tech.jp/40wdig-pm"
    },
    ve: {
      20: "https://lp.her-tech.jp/20veig-pm",
      30: "https://lp.her-tech.jp/30veig-pm",
      40: "https://lp.her-tech.jp/40veyt-pm"
    }
  };

  var field = null;

  // このページに付いているパラメータ（?以降）をLPのURLへ引き継ぐ
  // 同名キーはこのページ側の値を優先
  function buildUrl(base) {
    var incoming = new URLSearchParams(window.location.search);
    var url = new URL(base);
    incoming.forEach(function (v, k) { url.searchParams.delete(k); });
    incoming.forEach(function (v, k) { url.searchParams.append(k, v); });
    return url.toString();
  }

  function show(id) {
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("show", p.id === id); });
    window.scrollTo(0, 0);
  }

  // 分野はハッシュ（#wd / #ve）で保持 → ?以降は消えず、ブラウザの「戻る」でSTEP1に戻れる
  function render() {
    var h = window.location.hash.replace("#", "");
    if (h === "wd" || h === "ve") { field = h; show("step-age"); }
    else { field = null; show("step-field"); }
  }

  document.querySelectorAll("[data-field]").forEach(function (btn) {
    btn.addEventListener("click", function () { window.location.hash = btn.dataset.field; });
  });

  document.querySelectorAll("[data-age]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (!field) return;
      var dest = buildUrl(LP[field][btn.dataset.age]);
      // GTM導入時に計測できるようにイベントを積む
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: "cushion_select", cushion_field: field, cushion_age: btn.dataset.age, cushion_dest: dest });
      window.location.href = dest;
    });
  });

  window.addEventListener("hashchange", render);
  window.addEventListener("pageshow", function (e) { if (e.persisted) render(); });
  render();
})();
</script>
</body>
</html>
